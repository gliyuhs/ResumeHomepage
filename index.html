<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>李昱宏 — 终身学习者 · 系统性构建者</title>
  <meta name="description" content="以系统思维拆解复杂问题，以创造性表达链接业务与用户。专注流程架构、运营体系沉淀与产品化落地。">
  <meta name="author" content="李昱宏">
  <meta name="theme-color" content="#050705">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600;9..144,800&family=Inter:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-deep: #050705;
      --glass-bg: rgba(16, 20, 16, 0.55);
      --glass-bg-hover: rgba(22, 27, 22, 0.78);
      --glass-border: rgba(235, 240, 230, 0.07);
      --glass-border-hover: rgba(235, 240, 230, 0.2);
      --text-main: #eef0e8;
      --text-dim: #9aa094;
      --text-faint: #4c5248;

      --accent: #a8bc85;
      --accent-deep: #75885a;
      --accent-glow: rgba(168, 188, 133, 0.45);
      --navy: #33456b;
      --wine: #7a3243;

      --serif: "Fraunces", "Noto Serif SC", serif;
      --sans: "Inter", "Noto Sans SC", system-ui, sans-serif;

      --shadow-float: 0 30px 60px -15px rgba(0, 0, 0, 0.85), 0 15px 25px -10px rgba(0, 0, 0, 0.5);
      --shadow-inset: inset 0 1px 0 rgba(255, 255, 255, 0.1);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);

      --container: 1320px;
      --pad-x: clamp(1.5rem, 5vw, 4rem);
      --section-pad: clamp(8rem, 14vw, 12rem);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--sans);
      background: var(--bg-deep);
      color: var(--text-main);
      font-weight: 300;
      font-size: 16px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      position: relative;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,0.72) 100%);
      pointer-events: none;
      z-index: 9998;
    }

    .grain {
      position: fixed;
      inset: -20%;
      width: 140%;
      height: 140%;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.065;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      animation: grainShift 8s steps(6) infinite;
    }

    @keyframes grainShift {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-3%, 2%); }
      50% { transform: translate(2%, -3%); }
      75% { transform: translate(-2%, 3%); }
    }

    /* ===== 环境光斑：沿整页连续分布，跨板块流动 ===== */
    .ambient {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.85;
      transform: translate3d(
        calc(var(--px, 0) * var(--f, 10) * 1px),
        calc(var(--py, 0) * var(--f, 10) * 1px), 0);
      transition: transform 0.6s ease-out;
    }

    .glow-1 { top: -2%;  left: -10%; width: 800px; height: 800px; --f: 14;
      background: radial-gradient(circle, rgba(117, 136, 90, 0.32), transparent 70%); }
    .glow-2 { top: 13%;  right: -12%; width: 860px; height: 860px; --f: -9;
      background: radial-gradient(circle, rgba(51, 69, 107, 0.28), transparent 70%); }
    .glow-3 { top: 33%;  left: -10%; width: 820px; height: 820px; --f: 12;
      background: radial-gradient(circle, rgba(168, 188, 133, 0.2), transparent 70%); }
    .glow-4 { top: 52%;  right: -12%; width: 900px; height: 900px; --f: -11;
      background: radial-gradient(circle, rgba(122, 50, 67, 0.24), transparent 70%); }
    .glow-5 { top: 68%;  left: 10%; width: 760px; height: 760px; --f: 9;
      background: radial-gradient(circle, rgba(51, 69, 107, 0.18), transparent 70%); }
    .glow-6 { top: 82%;  left: calc(50% - 450px); width: 950px; height: 950px; --f: -13;
      background: radial-gradient(circle, rgba(168, 188, 133, 0.26), transparent 70%); }

    a { color: inherit; text-decoration: none; transition: color 0.3s ease; }
    a:hover { color: var(--accent); }

    .container {
      max-width: var(--container);
      margin: 0 auto;
      padding: 0 var(--pad-x);
      position: relative;
      z-index: 2;
    }

    /* ========== 导航 ========== */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 1.5rem 0;
      background: transparent;
      transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      border-bottom: 1px solid transparent;
    }

    .nav.scrolled {
      background: rgba(5, 7, 5, 0.72);
      backdrop-filter: blur(30px) saturate(150%);
      -webkit-backdrop-filter: blur(30px) saturate(150%);
      border-bottom-color: var(--glass-border);
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      padding: 1rem 0;
    }

    .nav-container {
      max-width: var(--container);
      margin: 0 auto;
      padding: 0 var(--pad-x);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-logo {
      font-family: var(--serif);
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 2.5rem;
      align-items: center;
    }

    .nav-links a {
      font-size: 0.85rem;
      color: var(--text-dim);
      letter-spacing: 0.08em;
    }

    .nav-links a:hover { color: var(--text-main); }

    .nav-links .nav-cta {
      padding: 0.6rem 1.4rem;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      border-radius: 100px;
      color: var(--text-main);
      font-size: 0.82rem;
      transition: all 0.3s ease;
    }

    .nav-links .nav-cta:hover {
      border-color: rgba(168, 188, 133, 0.5);
      background: rgba(168, 188, 133, 0.1);
      box-shadow: 0 0 20px rgba(168, 188, 133, 0.25);
      color: var(--accent);
    }

    /* ========== 玻璃工具类 ========== */
    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(24px) saturate(140%);
      -webkit-backdrop-filter: blur(24px) saturate(140%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-float), var(--shadow-inset);
      position: relative;
    }

    .glass::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      z-index: 2;
      pointer-events: none;
    }

    /* ========== 滚动显现 ========== */
    .rv {
      opacity: 0;
      transform: translateY(64px);
      transition:
        opacity 0.9s var(--ease) var(--d, 0s),
        transform 0.9s var(--ease) var(--d, 0s);
    }

    section.active .rv {
      opacity: 1;
      transform: translateY(0);
    }

    .stagger > .rv:nth-child(1) { --d: 0.05s; }
    .stagger > .rv:nth-child(2) { --d: 0.18s; }
    .stagger > .rv:nth-child(3) { --d: 0.31s; }
    .stagger > .rv:nth-child(4) { --d: 0.44s; }

    /* 项目卡独立激活槽 */
    .pc-slot {
      opacity: 0;
      transform: translateY(70px);
      transition:
        opacity 1s var(--ease) var(--d, 0s),
        transform 1s var(--ease) var(--d, 0s);
    }

    .pc-slot.in {
      opacity: 1;
      transform: translateY(0);
    }

    /* ========== Hero ========== */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: var(--section-pad) 0;
      padding-top: calc(var(--section-pad) + 5rem);
      position: relative;
    }

    .hero-container { max-width: 1100px; }

    .hero-title-wrap { position: relative; margin-bottom: 3rem; }

    .hero-bg-text,
    .section-title-bg,
    .cinematic-bg-text {
      transform: translateY(var(--ty, 0px)) rotate(var(--rot, 0deg));
      will-change: transform;
    }

    .hero-bg-text {
      position: absolute;
      top: -5rem; left: -2rem;
      font-family: var(--serif);
      font-size: clamp(7rem, 18vw, 20rem);
      font-weight: 800;
      color: rgba(238, 240, 232, 0.04);
      -webkit-text-stroke: 1px rgba(168, 188, 133, 0.14);
      z-index: 0;
      line-height: 0.85;
      letter-spacing: -0.05em;
      pointer-events: none;
      user-select: none;
      text-shadow: 0 0 80px rgba(168, 188, 133, 0.12);
    }

    .hero-meta {
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 2.5rem;
      padding: 0.6rem 1.2rem;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 100px;
      font-size: 0.78rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-dim);
      position: relative;
      z-index: 2;
      animation: float-slow 6s ease-in-out infinite;
    }

    .hero-meta::before {
      content: "";
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    .hero-title {
      font-family: var(--serif);
      font-size: clamp(2.2rem, 5.5vw, 4.5rem);
      font-weight: 300;
      line-height: 1.15;
      letter-spacing: -0.015em;
      position: relative;
      z-index: 1;
      text-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .hero-title span {
      color: var(--accent);
      font-style: italic;
      text-shadow: 0 0 30px var(--accent-glow);
    }

    .hero-subtitle {
      font-size: clamp(1rem, 1.4vw, 1.15rem);
      color: var(--text-dim);
      max-width: 640px;
      margin-bottom: 4rem;
      line-height: 1.85;
      position: relative;
      z-index: 1;
    }

    .hero-actions {
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 1.1rem 2rem;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      border-radius: 4px;
      transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg, #9db07a, #75885a);
      color: #0c0f08;
      box-shadow: 0 10px 30px rgba(117, 136, 90, 0.3), 0 0 0 1px rgba(168, 188, 133, 0.45);
    }

    .btn-primary:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 20px 45px rgba(117, 136, 90, 0.45), 0 0 60px rgba(168, 188, 133, 0.32);
      color: #0c0f08;
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
    }

    .btn-ghost:hover {
      transform: translateY(-4px) scale(1.02);
      border-color: rgba(168, 188, 133, 0.55);
      background: rgba(168, 188, 133, 0.08);
      color: var(--text-main);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45), 0 0 60px rgba(168, 188, 133, 0.3);
    }

    .hero-enter > * {
      opacity: 0;
      transform: translateY(40px);
      animation: heroEnter 1.2s var(--ease) forwards;
    }
    .hero-enter > *:nth-child(1) { animation-delay: 0.2s; }
    .hero-enter > *:nth-child(2) { animation-delay: 0.5s; }
    .hero-enter > *:nth-child(3) { animation-delay: 0.8s; }
    .hero-enter > *:nth-child(4) { animation-delay: 1.1s; }

    @keyframes heroEnter { to { opacity: 1; transform: translateY(0); } }

    @keyframes float-slow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* ========== 通用 Section ========== */
    section {
      padding: var(--section-pad) 0;
      position: relative;
    }

    .section-header {
      margin-bottom: 4.5rem;
      position: relative;
      z-index: 2;
    }

    .section-label {
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
      font-size: 0.72rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.5rem;
      font-weight: 500;
    }

    .section-label::before {
      content: "";
      width: 24px; height: 1px;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    .section-title-wrap { position: relative; display: inline-block; }

    .section-title-bg {
      position: absolute;
      top: -1.5rem; left: -1rem;
      font-family: var(--serif);
      font-size: clamp(4rem, 8vw, 7rem);
      font-weight: 800;
      color: rgba(238, 240, 232, 0.05);
      -webkit-text-stroke: 1px rgba(168, 188, 133, 0.16);
      z-index: -1;
      line-height: 0.8;
      letter-spacing: -0.05em;
      pointer-events: none;
      user-select: none;
    }

    .section-title {
      font-family: var(--serif);
      font-size: clamp(1.8rem, 3.8vw, 3rem);
      font-weight: 400;
      line-height: 1.2;
      position: relative;
      z-index: 1;
      text-shadow: 0 8px 20px rgba(0,0,0,0.6);
    }

    .section-intro {
      color: var(--text-dim);
      max-width: 680px;
      font-size: 1.05rem;
      line-height: 1.8;
      margin-top: 1.5rem;
    }

    /* ========== 能力矩阵 ========== */
    .capabilities-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.5rem;
      align-items: start;
      position: relative;
      z-index: 2;
    }

    .capability-card {
      position: relative;
      padding: 1.9rem 1.75rem 1.4rem;
      border-radius: 8px;
      max-height: 158px;
      overflow: hidden;
      transition:
        max-height 0.6s var(--ease),
        transform 0.55s var(--ease),
        background 0.55s ease,
        border-color 0.55s ease,
        box-shadow 0.55s ease;
      cursor: default;
    }

    .capability-card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 8px;
      background: linear-gradient(135deg, #161c12 0%, #0a0d09 100%);
      opacity: 0;
      transition: opacity 0.55s ease;
      z-index: 0;
    }

    .capability-card:hover,
    .capability-card.is-open {
      max-height: 430px;
      transform: translateY(-8px) scale(1.015);
      background: var(--glass-bg-hover);
      border-color: var(--glass-border-hover);
      box-shadow: 0 35px 70px -18px rgba(0,0,0,0.95), 0 0 50px rgba(168, 188, 133, 0.14), var(--shadow-inset);
      z-index: 5;
    }

    .capability-card:hover::after,
    .capability-card.is-open::after { opacity: 1; }

    .capability-num {
      position: absolute;
      top: -1.25rem; right: 0.75rem;
      font-family: var(--serif);
      font-size: 8.5rem;
      font-weight: 800;
      color: rgba(238, 240, 232, 0.03);
      line-height: 1;
      z-index: 0;
      pointer-events: none;
      transition: all 0.55s ease;
    }

    .capability-card:hover .capability-num,
    .capability-card.is-open .capability-num {
      color: rgba(168, 188, 133, 0.07);
      text-shadow: 0 0 50px rgba(168, 188, 133, 0.18);
    }

    .capability-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      position: relative;
      z-index: 1;
    }

    .capability-title {
      font-family: var(--serif);
      font-size: 1.35rem;
      font-weight: 500;
      color: var(--text-main);
      letter-spacing: -0.005em;
      line-height: 1.3;
    }

    .capability-badge {
      flex-shrink: 0;
      margin-top: 0.25rem;
      padding: 0.35rem 0.9rem;
      background: rgba(168, 188, 133, 0.12);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(168, 188, 133, 0.3);
      border-radius: 4px;
      font-size: 0.68rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      box-shadow: 0 4px 10px rgba(0,0,0,0.35), 0 0 12px rgba(168, 188, 133, 0.15);
      font-weight: 500;
    }

    .capability-hint {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-top: 1rem;
      font-size: 0.66rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-faint);
      transition: all 0.35s ease;
      position: relative;
      z-index: 1;
    }

    .capability-hint::after {
      content: "";
      width: 30px; height: 1px;
      background: var(--text-faint);
    }

    .capability-card:hover .capability-hint,
    .capability-card.is-open .capability-hint {
      opacity: 0;
      transform: translateX(10px);
    }

    .capability-body {
      opacity: 0;
      transform: translateY(24px);
      transition: all 0.45s var(--ease) 0.1s;
      position: relative;
      z-index: 1;
      margin-top: 1.1rem;
      padding-top: 1.1rem;
      border-top: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .capability-card:hover .capability-body,
    .capability-card.is-open .capability-body {
      opacity: 1;
      transform: translateY(0);
    }

    .capability-block-label {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.45rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .capability-block-label::before {
      content: "";
      width: 4px; height: 4px;
      background: var(--accent);
      border-radius: 50%;
    }

    .capability-block p {
      color: var(--text-dim);
      font-size: 0.92rem;
      line-height: 1.7;
    }

    /* ========== 项目拼贴墙 ========== */
    .projects-collage {
      display: grid;
      grid-template-columns: 1.04fr 0.96fr;
      column-gap: 2.5rem;
      align-items: start;
      position: relative;
      z-index: 2;
      padding: 2rem 0 1rem;
    }

    .collage-col { display: flex; flex-direction: column; }

    .collage-col-right { padding-top: 9rem; }

    .collage-col-left  .pc-slot + .pc-slot { margin-top: 4.5rem; }
    .collage-col-right .pc-slot + .pc-slot { margin-top: 5.5rem; }

    .project-card {
      position: relative;
      height: var(--ch);
      background: transparent;
      border: none;
      box-shadow: none;
      transform: rotate(var(--rot));
      transition:
        height 0.6s var(--ease),
        transform 0.6s var(--ease);
      will-change: transform;
    }

    .pc-1 { --vh: 300px; --ch: 340px; --it: 150px; --eh: 560px; --eit: 260px; --rot: -1.3deg;
      margin-right: -2rem;    z-index: 1; }
    .pc-2 { --vh: 270px; --ch: 310px; --it: 132px; --eh: 530px; --eit: 230px; --rot: 1.6deg;
      margin-left: -3rem;     z-index: 2; }
    .pc-3 { --vh: 290px; --ch: 330px; --it: 142px; --eh: 550px; --eit: 250px; --rot: -0.9deg;
      margin-left: 1.75rem; margin-right: -3rem;  z-index: 3; }
    .pc-4 { --vh: 310px; --ch: 352px; --it: 158px; --eh: 570px; --eit: 270px; --rot: 1.2deg;
      margin-left: -1.25rem;  z-index: 2; }

    .project-card:hover,
    .project-card.is-open {
      z-index: 50;
      height: var(--eh);
      transform: rotate(0deg) translateY(-16px) scale(1.05);
    }

    .project-glow {
      position: absolute;
      top: 10%; left: 10%; width: 80%; height: 60%;
      background: radial-gradient(circle, rgba(168, 188, 133, 0.22), transparent 70%);
      filter: blur(60px);
      z-index: 0;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .project-card:hover .project-glow,
    .project-card.is-open .project-glow { opacity: 1; }

    /* 背景板：完全静态 */
    .project-visual {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: var(--vh);
      border-radius: 8px;
      z-index: 1;

      z-index: 0;

      white-space: nowrap;

    .philosophy-card:nth-child(3) { animation-delay: 5s; }

      transform: translateY(-15px) scale(1.02);
      border-color: var(--glass-border-hover);

      margin-left: 0.4rem;
      line-height: 0;
      vertical-align: -0.3em;
      text-shadow: 0 0 15px var(--accent-glow);

    .philosophy-desc {

      font-size: 0.92rem;
      line-height: 1.75;

  <script>
    /* ============ 读取后台配置并渲染 ============ */
    const DATA = JSON.parse(document.getElementById('site-data').textContent);

    const tpl = (html) => {
      const t = document.createElement('template');
      t.innerHTML = html.trim();
      return t.content.firstElementChild;
    };

    document.title = DATA.site.title;
    document.getElementById('nav-logo').textContent = DATA.site.name;
    document.getElementById('footer-text').textContent = DATA.site.footer;

    // 导航
    DATA.nav.forEach(n => {
      const li = tpl('<li></li>');
      const a = tpl(`<a href="${n.href}"></a>`);
      a.textContent = n.label;
      if (n.cta) a.className = 'nav-cta';
      li.appendChild(a);
      document.getElementById('nav-links').appendChild(li);
    });

    // Hero
    (function () {
      const h = DATA.hero;
      const root = document.getElementById('hero-root');
      root.appendChild(tpl(`<div class="hero-meta"><span>${h.meta}</span></div>`));
      root.appendChild(tpl(`
        <div class="hero-title-wrap">
          <span class="hero-bg-text">${h.bgText}</span>
          <h1 class="hero-title">${h.titleHTML}</h1>
        </div>`));
      root.appendChild(tpl(`<p class="hero-subtitle">${h.subtitleHTML}</p>`));
      const actions = tpl('<div class="hero-actions"></div>');
      h.buttons.forEach(b => {
        actions.appendChild(tpl(`<a class="btn btn-${b.style}" href="${b.href}">${b.label}</a>`));
      });
      root.appendChild(actions);
    })();

    // Section 头部
    function renderHeader(id, d) {
      document.getElementById(id).innerHTML = `
        <span class="section-label">${d.label}</span>
        <div class="section-title-wrap">
          <span class="section-title-bg">${d.bgText}</span>
          <h2 class="section-title">${d.title}</h2>
        </div>
        <p class="section-intro">${d.intro}</p>`;
    }

    function renderCta(id, d) {
      document.getElementById(id).innerHTML = `<a href="${d.href}">${d.label}</a>`;
    }

    renderHeader('cap-header', DATA.capabilities);
    renderCta('cap-cta', DATA.capabilities.cta);
    renderHeader('proj-header', DATA.projects);
    renderCta('proj-cta', DATA.projects.cta);
    renderHeader('phi-header', DATA.philosophy);

    // 能力卡片
    DATA.capabilities.items.forEach((c, i) => {
      document.getElementById('cap-grid').appendChild(tpl(`
        <article class="capability-card glass rv">
          <div class="capability-num">0${i + 1}</div>
          <div class="capability-head">
            <h3 class="capability-title">${c.title}</h3>
            <span class="capability-badge">${c.badge}</span>
          </div>
          <div class="capability-hint"><span>${DATA.ui.hoverHint}</span></div>
          <div class="capability-body">
            <div class="capability-block">
              <div class="capability-block-label">${DATA.ui.coreLabel}</div>
              <p>${c.core}</p>
            </div>
            <div class="capability-block">
              <div class="capability-block-label">${DATA.ui.sceneLabel}</div>
              <p>${c.scenes}</p>
            </div>
          </div>
        </article>`));
    });

    // 项目卡片：左右列交替，逐张独立激活
    const cols = [document.getElementById('col-left'), document.getElementById('col-right')];
    DATA.projects.items.forEach((p, i) => {
      const slot = tpl(`<div class="pc-slot" style="--d:${(i * 0.12).toFixed(2)}s"></div>`);
      slot.appendChild(tpl(`
        <article class="project-card pc-${(i % 4) + 1}">
          <div class="project-glow"></div>
          <div class="project-visual"><span class="project-visual-num">0${i + 1}</span></div>
          <div class="project-info-glass glass">
            <div class="project-position">${p.position}</div>
            <h3 class="project-title">${p.title}</h3>
            <p class="project-summary">${p.summary}</p>
          </div>
        </article>`));
      cols[i % 2].appendChild(slot);
    });

    // 哲学大字母（右上 / 左下分离定位）+ 卡片
    const wordPos = ['top:6%; right:-4%; --rot:-3deg;', 'bottom:4%; left:-2%; --rot:2deg;'];
    (DATA.philosophy.bgWords || []).forEach((w, i) => {
      document.getElementById('phi-words').appendChild(
        tpl(`<span class="cinematic-bg-text" style="${wordPos[i % 2]}">${w}</span>`));
    });

    DATA.philosophy.items.forEach(item => {
      document.getElementById('phi-grid').appendChild(tpl(`
        <article class="philosophy-card glass rv">
          <h3 class="philosophy-card-title">${item.title}</h3>
          <div class="philosophy-card-en">${item.en}</div>
          <div class="philosophy-principle">${item.principle}</div>
          <p class="philosophy-desc">${item.desc}</p>
        </article>`));
    });

    // 联系
    (function () {
      const c = DATA.contact;
      document.getElementById('contact-root').innerHTML = `
        <span class="section-label" style="justify-content:center;">${c.label}</span>
        <h2 class="section-title" style="margin-bottom:1.5rem;">${c.title}</h2>
        <p class="contact-vision">${c.vision}</p>
        <p class="contact-quote">${c.quote}</p>
        <div class="contact-divider"></div>
        <span class="contact-email-label">${c.emailLabel}</span>
        <a href="mailto:${c.email}" class="contact-email">${c.email}</a>
        <div style="margin-top:3rem;">
          <a href="${c.cta.href}" class="btn btn-primary">${c.cta.label}</a>
        </div>`;
    })();

    /* ============ 交互系统 ============ */
    const nav = document.querySelector('.nav');
    window.addEventListener('scroll', () => {
      nav.classList.toggle('scrolled', window.scrollY > 50);
    }, { passive: true });

    // 环境光视差
    document.addEventListener('mousemove', (e) => {
      const px = (e.clientX / window.innerWidth - 0.5) * 2;
      const py = (e.clientY / window.innerHeight - 0.5) * 2;
      document.documentElement.style.setProperty('--px', px.toFixed(3));
      document.documentElement.style.setProperty('--py', py.toFixed(3));
    });

    // 板块级显现（头部 / CTA 等）
    const sectionObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        entry.target.classList.toggle('active', entry.isIntersecting);
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -8% 0px' });
    document.querySelectorAll('section').forEach(s => sectionObserver.observe(s));

    // 项目卡片逐张独立激活
    const slotObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        entry.target.classList.toggle('in', entry.isIntersecting);
      });
    }, { threshold: 0.15 });
    document.querySelectorAll('.pc-slot').forEach(s => slotObserver.observe(s));

    // 背景大字母滚动视差
    const bgLetters = document.querySelectorAll('.hero-bg-text, .section-title-bg, .cinematic-bg-text');
    let ticking = false;
    function parallax() {
      const vh = window.innerHeight;
      bgLetters.forEach(el => {
        const r = el.getBoundingClientRect();
        if (r.bottom < -200 || r.top > vh + 200) return;
        const c = (r.top + r.height / 2 - vh / 2) / vh;
        el.style.setProperty('--ty', (c * -50).toFixed(1) + 'px');
      });
      ticking = false;
    }
    window.addEventListener('scroll', () => {
      if (!ticking) { requestAnimationFrame(parallax); ticking = true; }
    }, { passive: true });

    // 触屏：点按展开卡片
    if (window.matchMedia('(hover: none)').matches) {
      document.addEventListener('click', (e) => {
        const card = e.target.closest('.capability-card, .project-card');
        if (!card) return;
        const group = card.classList.contains('capability-card') ? '.capability-card' : '.project-card';
        document.querySelectorAll(group + '.is-open').forEach(c => {
          if (c !== card) c.classList.remove('is-open');
        });
        card.classList.toggle('is-open');
      });
    }

    // 锚点平滑滚动（事件委托，兼容动态渲染的链接）
    document.addEventListener('click', (e) => {
      const a = e.target.closest('a[href^="#"]');
      if (!a) return;
      const href = a.getAttribute('href');
      if (href.length <= 1) return;
      const target = document.querySelector(href);
      if (target) {
        e.preventDefault();
        const targetPos = target.getBoundingClientRect().top + window.scrollY - nav.offsetHeight - 30;
        window.scrollTo({ top: targetPos, behavior: 'smooth' });
      }
    });
  </script>
</body>
</html>
